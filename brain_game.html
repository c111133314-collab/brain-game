<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大腦大冒險：學習心理學現實挑戰</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
        }

        body {
            background-color: #121824;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-card {
            width: 100%;
            max-width: 800px;
            background: #1e2638;
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.6);
            border: 2px solid #2d374e;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #2d374e;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .title {
            font-size: 1.8rem;
            color: #ffd166;
            font-weight: bold;
        }

        .stats-group {
            display: flex;
            gap: 20px;
        }

        .stat-item {
            font-size: 1.2rem;
            font-weight: bold;
            background: #121824;
            padding: 8px 16px;
            border-radius: 12px;
        }

        .hp-text { color: #ef476f; }
        .score-text { color: #06d6a0; }

        .scenario-box {
            background: #253047;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 25px;
            border-left: 6px solid #ffd166;
        }

        .scenario-tag {
            font-size: 1rem;
            color: #ffd166;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .scenario-title {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .scenario-desc {
            font-size: 1.15rem;
            color: #cbd5e1;
            line-height: 1.6;
        }

        .options-title {
            font-size: 1.2rem;
            color: #94a3b8;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
        }

        .option-btn {
            background: #2a354d;
            border: 2px solid #3b4968;
            border-radius: 14px;
            padding: 18px 24px;
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .option-btn:hover {
            background: #3b4968;
            border-color: #ffd166;
            transform: translateY(-2px);
        }

        .option-tag {
            font-size: 0.95rem;
            padding: 4px 10px;
            border-radius: 6px;
            background: #121824;
            color: #94a3b8;
        }

        /* 4個工作記憶插槽視覺區 */
        .memory-slots-container {
            background: #121824;
            border-radius: 14px;
            padding: 15px;
            margin-top: 20px;
        }

        .memory-title {
            font-size: 1rem;
            color: #94a3b8;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
        }

        .slots-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .slot {
            background: #1e2638;
            border: 2px dashed #3b4968;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            font-size: 0.95rem;
            color: #64748b;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .slot.filled {
            border-style: solid;
            border-color: #06d6a0;
            color: #06d6a0;
            background: rgba(6, 214, 160, 0.1);
            font-weight: bold;
        }

        /* 解析彈窗 */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 100;
        }

        .modal-content {
            background: #1e2638;
            border-radius: 20px;
            padding: 30px;
            max-width: 650px;
            width: 100%;
            border: 2px solid #ffd166;
        }

        .result-badge {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .badge-success { background: rgba(6, 214, 160, 0.2); color: #06d6a0; }
        .badge-fail { background: rgba(239, 71, 111, 0.2); color: #ef476f; }

        .modal-title { font-size: 1.6rem; color: #ffd166; margin-bottom: 15px; }

        .science-box {
            background: #121824;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 4px solid #118ab2;
        }

        .practice-box {
            background: #121824;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 4px solid #06d6a0;
        }

        .modal-btn {
            background: #ffd166;
            color: #121824;
            border: none;
            padding: 14px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
        }

        .modal-btn:hover { background: #f7c548; }
    </style>
</head>
<body>

<div class="game-card">
    <div class="game-header">
        <div class="title">🧠 大腦大冒險：學習實踐篇</div>
        <div class="stats-group">
            <div class="stat-item">意志力 HP: <span id="hp" class="hp-text">100</span></div>
            <div class="stat-item">學習積分: <span id="score" class="score-text">0</span></div>
        </div>
    </div>

    <!-- 關卡情境描述 -->
    <div class="scenario-box">
        <div class="scenario-tag" id="stage-tag">第 1 / 3 關：拖延怪襲來</div>
        <div class="scenario-title" id="stage-title">面對 10 頁的期末報告，完全不想動手...</div>
        <div class="scenario-desc" id="stage-desc">
            你打開空白文件，想到要寫整整 10 頁就感到無比痛苦，腦袋一片空白，忍不住想拿手機起來刷...
        </div>
    </div>

    <!-- 白話抉擇選項 -->
    <div class="options-title">👉 如果是你，現實中會怎麼做？</div>
    <div class="options-grid" id="options-container">
        <!-- 動態渲染選項 -->
    </div>

    <!-- 4 個工作記憶插槽視覺區 -->
    <div class="memory-slots-container">
        <div class="memory-title">
            <span>🧠 大腦工作記憶區 (固定 4 個插槽容量上限)</span>
            <span id="slot-count">已解鎖策略: 0 / 4</span>
        </div>
        <div class="slots-grid">
            <div class="slot" id="slot-0">空插槽 1</div>
            <div class="slot" id="slot-1">空插槽 2</div>
            <div class="slot" id="slot-2">空插槽 3</div>
            <div class="slot" id="slot-3">空插槽 4</div>
        </div>
    </div>
</div>

<!-- 解析彈窗 -->
<div class="modal" id="result-modal">
    <div class="modal-content">
        <div id="result-badge" class="result-badge badge-success">解析成果</div>
        <div class="modal-title" id="modal-title">背後的神經科學原理</div>
        
        <div class="science-box">
            <div style="color: #118ab2; font-weight: bold; margin-bottom: 5px;">🔬 大腦運作機制</div>
            <div id="modal-science" style="line-height: 1.5; color: #cbd5e1;"></div>
        </div>

        <div class="practice-box">
            <div style="color: #06d6a0; font-weight: bold; margin-bottom: 5px;">💡 現實中你可以這樣做</div>
            <div id="modal-practice" style="line-height: 1.5; color: #cbd5e1;"></div>
        </div>

        <button class="modal-btn" onclick="nextStage()">進入下一題情境</button>
    </div>
</div>

<script>
    // 可供自行修改的關卡情境資料庫
    const stages = [
        {
            tag: "第 1 關：拖延怪襲來（痛覺活化）",
            title: "面對 10 頁的期末報告，完全不想動手...",
            desc: "你打開空白文件，想到要寫整整 10 頁就感到無比痛苦，腦袋一片空白，忍不住想拿手機起來刷...",
            options: [
                {
                    text: "❌ 硬逼自己今天一定要一次寫完 10 頁！",
                    tag: "強硬硬幹",
                    isCorrect: false,
                    hpChange: -30,
                    scoreChange: 0,
                    science: "當大腦預期要面對巨大、困難的目標時，大腦的【痛覺中樞】會被活化！這會讓你產生生理上的痛苦感，進而觸發『拖延』來逃避痛苦。",
                    practice: "不要盯著『10 頁報告』這個巨大結果看！強硬硬幹只會快速消耗你的意志力。"
                },
                {
                    text: "✅ 設定 25 分鐘番茄鐘，只告訴自己「先寫第 1 段就好」",
                    tag: "關注過程 (Unit 4)",
                    isCorrect: true,
                    hpChange: 0,
                    scoreChange: 35,
                    unlockedSkill: "🍅 25min 番茄戰術",
                    science: "大腦痛覺中樞只對『最終結果』產生痛苦。當你把目標縮小到『專注 25 分鐘的過程』時，痛覺中樞就會安靜下來，拖延感立刻消失！",
                    practice: "打開計時器設 25 分鐘，告訴自己這段時間就算只寫出 3 行白話字也算成功！"
                }
            ]
        },
        {
            tag: "第 2 關：思維定勢 Boss（專注與發散模式切換）",
            title: "這道數學題你已經算了 15 分鐘，越算越氣卻找不到答案...",
            desc: "你用了 3 種算術方法都算不出來，計算紙塗得滿滿的，頭開始微微發痛，覺得自己很笨...",
            options: [
                {
                    text: "❌ 氣死我了！今天不把它算出來我不睡覺！繼續死磕！",
                    tag: "思維定勢死鎖 (Unit 3)",
                    isCorrect: false,
                    hpChange: -40,
                    scoreChange: 0,
                    science: "這就是神經科學上的【思維定勢 (Einstellung Effect)】！當你在『專注模式』陷在錯誤解法時，大腦神經迴路會重複走舊路，你死磕再久也找不到新思路。",
                    practice: "死磕只會讓你腦袋燒毀。此時繼續專注只是在浪費時間。"
                },
                {
                    text: "✅ 先放下筆！站起來去洗一把臉、聽首歌或散步 10 分鐘",
                    tag: "發散模式切換 (Unit 1)",
                    isCorrect: true,
                    hpChange: +10,
                    scoreChange: 35,
                    unlockedSkill: "🌊 發散切換法",
                    science: "當你停止死磕時，大腦會切換到【發散模式】！此時腦脊髓液會沖洗代謝毒素，大腦會在背景自動重新連結資訊，往往在你洗臉時突然彈出『頓悟（Eureka）』！",
                    practice: "卡關超過 10 分鐘時，強迫自己離開書桌！去運動、散步或睡個短覺，給大腦背景運算的空間。"
                }
            ]
        },
        {
            tag: "第 3 關：應試焦慮與記憶鞏固",
            title: "明天就要大考了，你發現還有 500 個英文單字沒背完...",
            desc: "你的心跳快速發瘋跳動，手心出汗，腦袋裡一直有個聲音說：「完蛋了，我一定會考砸...」",
            options: [
                {
                    text: "✅ 深呼吸，告訴自己「心跳加速是大腦在為我預熱興奮，準備發揮最佳戰力！」",
                    tag: "認知重塑 (Unit 6)",
                    isCorrect: true,
                    hpChange: 0,
                    scoreChange: 30,
                    unlockedSkill: "🫁 戰或逃重塑劑",
                    science: "這是在重新詮釋【戰或逃 (Fight-or-Flight)】生理反應！心跳加速與身體發抖只是皮質醇與腎上腺素分泌，將其解讀為『興奮戰備』能保護工作記憶插槽不被焦慮佔據。",
                    practice: "考前做 3 次腹式呼吸，告訴自己：『這不是害怕，是我的大腦正在進入極限戰鬥模式！』"
                },
                {
                    text: "❌ 焦慮地通宵熬夜狂背，順便一直罵自己為什麼不早點讀書",
                    tag: "認知耗竭",
                    isCorrect: false,
                    hpChange: -50,
                    scoreChange: 0,
                    science: "熬夜會讓腦中積聚大量毒素，工作記憶插槽從 4 個縮減到只剩 1 個！就算背進去，明天考試也會因為大腦運轉過熱而全面失憶。",
                    practice: "寧可複習核心重點後好好睡覺，睡眠時大腦才會把短期記憶轉化為長期組塊。"
                }
            ]
        }
    ];

    let currentStageIndex = 0;
    let hp = 100;
    let score = 0;
    let unlockedSkills = [];

    function renderStage() {
        const stage = stages[currentStageIndex];
        document.getElementById("stage-tag").innerText = stage.tag;
        document.getElementById("stage-title").innerText = stage.title;
        document.getElementById("stage-desc").innerText = stage.desc;

        const container = document.getElementById("options-container");
        container.innerHTML = "";

        stage.options.forEach((opt, idx) => {
            const btn = document.createElement("button");
            btn.className = "option-btn";
            btn.innerHTML = `
                <span>${opt.text}</span>
                <span class="option-tag">${opt.tag}</span>
            `;
            btn.onclick = () => selectOption(opt);
            container.appendChild(btn);
        });

        updateUI();
    }

    function selectOption(opt) {
        hp = Math.max(0, Math.min(100, hp + opt.hpChange));
        score += opt.scoreChange;

        if (opt.unlockedSkill && !unlockedSkills.includes(opt.unlockedSkill)) {
            if (unlockedSkills.length < 4) {
                unlockedSkills.push(opt.unlockedSkill);
            }
        }

        // 顯示解析彈窗
        const modal = document.getElementById("result-modal");
        const badge = document.getElementById("result-badge");
        
        if (opt.isCorrect) {
            badge.className = "result-badge badge-success";
            badge.innerText = "🎯 最佳大腦策略！";
        } else {
            badge.className = "result-badge badge-fail";
            badge.innerText = "⚠️ 踩中思維陷阱！";
        }

        document.getElementById("modal-science").innerText = opt.science;
        document.getElementById("modal-practice").innerText = opt.practice;
        modal.style.display = "flex";
    }

    function updateUI() {
        document.getElementById("hp").innerText = hp;
        document.getElementById("score").innerText = score;

        // 更新 4 個工作記憶插槽
        for (let i = 0; i < 4; i++) {
            const slotEl = document.getElementById(`slot-${i}`);
            if (unlockedSkills[i]) {
                slotEl.innerText = unlockedSkills[i];
                slotEl.className = "slot filled";
            } else {
                slotEl.innerText = `空插槽 ${i + 1}`;
                slotEl.className = "slot";
            }
        }

        document.getElementById("slot-count").innerText = `已解鎖策略: ${unlockedSkills.length} / 4`;
    }

    function nextStage() {
        document.getElementById("result-modal").style.display = "none";
        currentStageIndex++;

        if (currentStageIndex >= stages.length || hp <= 0) {
            showEndGame();
        } else {
            renderStage();
        }
    }

    function showEndGame() {
        alert(`🎉 遊戲結束！\n\n最終分數：${score} 分\n剩餘意志力 HP：${hp}\n\n恭喜你順利習得大腦神經科學的真實學習策略！`);
        location.reload();
    }

    // 初始化
    renderStage();
</script>

</body>
</html>
