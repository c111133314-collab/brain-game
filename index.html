<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大腦大冒險：學習心理學現實挑戰</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
        }

        body {
            background-color: #121824;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-card {
            width: 100%;
            max-width: 800px;
            background: #1e2638;
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.6);
            border: 2px solid #2d374e;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #2d374e;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .title {
            font-size: 1.8rem;
            color: #ffd166;
            font-weight: bold;
        }

        .stats-group {
            display: flex;
            gap: 20px;
        }

        .stat-item {
            font-size: 1.2rem;
            font-weight: bold;
            background: #121824;
            padding: 8px 16px;
            border-radius: 12px;
        }

        .hp-text { color: #ef476f; }
        .score-text { color: #06d6a0; }

        .scenario-box {
            background: #253047;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 25px;
            border-left: 6px solid #ffd166;
        }

        .scenario-tag {
            font-size: 1rem;
            color: #ffd166;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .scenario-title {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .scenario-desc {
            font-size: 1.15rem;
            color: #cbd5e1;
            line-height: 1.6;
        }

        .options-title {
            font-size: 1.2rem;
            color: #94a3b8;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
        }

        .option-btn {
            background: #2a354d;
            border: 2px solid #3b4968;
            border-radius: 14px;
            padding: 18px 24px;
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .option-btn:hover {
            background: #3b4968;
            border-color: #ffd166;
            transform: translateY(-2px);
        }

        .option-tag {
            font-size: 0.95rem;
            padding: 4px 10px;
            border-radius: 6px;
            background: #121824;
            color: #94a3b8;
        }

        /* 4個工作記憶插槽視覺區 */
        .memory-slots-container {
            background: #121824;
            border-radius: 14px;
            padding: 15px;
            margin-top: 20px;
        }

        .memory-title {
            font-size: 1rem;
            color: #94a3b8;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
        }

        .slots-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .slot {
            background: #1e2638;
            border: 2px dashed #3b4968;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            font-size: 0.95rem;
            color: #64748b;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .slot.filled {
            border-style: solid;
            border-color: #06d6a0;
            color: #06d6a0;
            background: rgba(6, 214, 160, 0.1);
            font-weight: bold;
        }

        /* 解析彈窗 */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 100;
        }

        .modal-content {
            background: #1e2638;
            border-radius: 20px;
            padding: 30px;
            max-width: 650px;
            width: 100%;
            border: 2px solid #ffd166;
        }

        .result-badge {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .badge-success { background: rgba(6, 214, 160, 0.2); color: #06d6a0; }
        .badge-fail { background: rgba(239, 71, 111, 0.2); color: #ef476f; }

        .modal-title { font-size: 1.6rem; color: #ffd166; margin-bottom: 15px; }

        .science-box {
            background: #121824;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 4px solid #118ab2;
        }

        .practice-box {
            background: #121824;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 4px solid #06d6a0;
        }

        .modal-btn {
            background: #ffd166;
            color: #121824;
            border: none;
            padding: 14px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
        }

        .modal-btn:hover { background: #f7c548; }
    </style>
</head>
<body>

<div class="game-card">
    <div class="game-header">
        <div class="title">🧠 大腦大冒險：學習實踐篇</div>
        <div class="stats-group">
            <div class="stat-item">意志力 HP: <span id="hp" class="hp-text">100</span></div>
            <div class="stat-item">學習積分: <span id="score" class="score-text">0</span></div>

    </div>

    <!-- 關卡情境描述 -->
    <div class="scenario-box">
        <div class="scenario-tag" id="stage-tag">🎲 隨機關卡抽樣中...</div>
        <div class="scenario-title" id="stage-title">載入中...</div>
        <div class="scenario-desc" id="stage-desc">載入中...</div>
    </div>

    <!-- 白話抉擇選項 -->
    <div class="options-title">👉 如果是你，現實中會怎麼做？</div>
    <div class="options-grid" id="options-container">
        <!-- 動態渲染選項 -->
    </div>

    <!-- 4 個工作記憶插槽視覺區 -->
    <div class="memory-slots-container">
        <div class="memory-title">
            <span>🧠 大腦工作記憶區 (固定 4 個插槽容量上限)</span>

</div>

<!-- 解析彈窗 -->
<div class="modal" id="result-modal">

        <div class="science-box">

            <div id="modal-science" style="line-height: 1.5; color: #cbd5e1;"></div>

        </div>

        <button class="modal-btn" onclick="nextStage()">進入下一題情境</button>
    </div>
</div>

    let currentStageIndex = 0;
    let hp = 100;
    let score = 0;
    let unlockedSkills = [];
    let activeStages = [];

    // 洗牌演算法（Fisher-Yates Shuffle）
    function shuffleArray(array) {
        const arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    // 初始化遊戲關卡（隨機從 12 個題庫抽出 4 關，對應大腦 4 個工作記憶插槽）
    function initGame() {
        activeStages = shuffleArray(scenarioPool).slice(0, 4);
        currentStageIndex = 0;
        hp = 100;
        score = 0;
        unlockedSkills = [];
        renderStage();
    }

    function renderStage() {
        const stage = activeStages[currentStageIndex];
        document.getElementById("stage-tag").innerText = `🎲 隨機第 ${currentStageIndex + 1} / 4 關：${stage.tag}`;
        document.getElementById("stage-title").innerText = stage.title;
        document.getElementById("stage-desc").innerText = stage.desc;

        const container = document.getElementById("options-container");
        container.innerHTML = "";

        stage.options.forEach((opt) => {
            const btn = document.createElement("button");
            btn.className = "option-btn";
            btn.innerHTML = `
                <span>${opt.text}</span>
                <span class="option-tag">${opt.tag}</span>
            `;
            btn.onclick = () => selectOption(opt);
            container.appendChild(btn);
        });

        updateUI();
    }

    function selectOption(opt) {
        hp = Math.max(0, Math.min(100, hp + opt.hpChange));
        score += opt.scoreChange;

        if (opt.unlockedSkill && !unlockedSkills.includes(opt.unlockedSkill)) {
            if (unlockedSkills.length < 4) {
                unlockedSkills.push(opt.unlockedSkill);
            }
        }

        // 顯示解析彈窗
        const modal = document.getElementById("result-modal");
        const badge = document.getElementById("result-badge");
        
        if (opt.isCorrect) {
            badge.className = "result-badge badge-success";
            badge.innerText = "🎯 最佳大腦策略！";
        } else {
            badge.className = "result-badge badge-fail";
            badge.innerText = "⚠️ 踩中思維陷阱！";
        }

        document.getElementById("modal-science").innerText = opt.science;
        document.getElementById("modal-practice").innerText = opt.practice;
        modal.style.display = "flex";
    }

    function updateUI() {
        document.getElementById("hp").innerText = hp;
        document.getElementById("score").innerText = score;

        // 更新 4 個工作記憶插槽
        for (let i = 0; i < 4; i++) {
            const slotEl = document.getElementById(`slot-${i}`);
            if (unlockedSkills[i]) {
                slotEl.innerText = unlockedSkills[i];
                slotEl.className = "slot filled";
            } else {
                slotEl.innerText = `空插槽 ${i + 1}`;
                slotEl.className = "slot";
            }
        }

        document.getElementById("slot-count").innerText = `已解鎖策略: ${unlockedSkills.length} / 4`;
    }

    function nextStage() {
        document.getElementById("result-modal").style.display = "none";
        currentStageIndex++;

        if (currentStageIndex >= activeStages.length || hp <= 0) {
            showEndGame();
        } else {
            renderStage();
        }
    }

    function showEndGame() {
        const finalMessage = hp <= 0 
            ? `💥 意志力耗盡！大腦燃燒過度陷入癱瘓... \n\n最終積分：${score} 分\n建議立刻去睡個覺讓大腦排毒！`
            : `🎉 恭喜通關！拿到了 ${score} 分的高分！\n\n剩餘意志力 HP：${hp}\n你成功將 4 個大腦工作記憶插槽填滿了正確的自學策略卡！`;
        
        alert(finalMessage);
        initGame(); // 重新洗牌開新局
    }

    // 初始化啟動
    initGame();
